services:
  api:
    build:
      context: ..
    environment:
      ADMIN_USER: admin
      ADMIN_SETUP_TOKEN: integration-setup-token-never-deploy-1234567890
      PUBLIC_ORIGIN: http://localhost:18080
      MAX_STORAGE_BYTES: "107374182400"
    volumes:
      - test_packages:/data
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    stop_grace_period: 40s
  caddy:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      PUBLIC_ORIGIN: http://localhost:18080
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv:ro
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/data, /config, /tmp]
    security_opt: [no-new-privileges:true]
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  test_packages:
