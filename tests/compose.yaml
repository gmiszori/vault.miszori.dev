services:
  api:
    build:
      context: ..
    environment:
      PUBLIC_LISTEN_ADDR: ${TEST_PUBLIC_API_IP:-172.30.0.2}:8080
      ADMIN_LISTEN_ADDR: ${TEST_PRIVATE_API_IP:-172.30.0.130}:8081
      ADMIN_PROXY_IP: ${TEST_ADMIN_PROXY_IP:-172.30.0.131}
      TRUSTED_PROXY_CIDR: ${TEST_TRUSTED_PROXY_CIDR:-172.30.0.0/24}
      ADMIN_USER: admin
      ADMIN_SETUP_TOKEN: integration-setup-token-never-deploy-1234567890
      PUBLIC_ORIGIN: http://localhost:18080
      MAX_STORAGE_BYTES: "107374182400"
    volumes:
      - test_packages:/data
    networks:
      backend:
        ipv4_address: ${TEST_PUBLIC_API_IP:-172.30.0.2}
      vpn_backend:
        ipv4_address: ${TEST_PRIVATE_API_IP:-172.30.0.130}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    stop_grace_period: 40s
  caddy:
    image: caddy:2.11-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      PUBLIC_ORIGIN: http://localhost:18080
      API_UPSTREAM: ${TEST_PUBLIC_API_IP:-172.30.0.2}:8080
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv:ro
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/data, /config, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
  caddy-vpn:
    image: caddy:2.11-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      PUBLIC_ORIGIN: http://localhost:18080
      API_UPSTREAM: ${TEST_PRIVATE_API_IP:-172.30.0.130}:8081
    ports:
      - "127.0.0.1:18081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv:ro
    networks:
      vpn_backend:
        ipv4_address: ${TEST_ADMIN_PROXY_IP:-172.30.0.131}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/data, /config, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
networks:
  backend:
    ipam:
      config:
        - subnet: ${TEST_PUBLIC_SUBNET:-172.30.0.0/25}
  vpn_backend:
    # Test clients use host-published HTTP; Docker Desktop suppresses these on internal-only networks.
    ipam:
      config:
        - subnet: ${TEST_PRIVATE_SUBNET:-172.30.0.128/25}
volumes:
  test_packages:
