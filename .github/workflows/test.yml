name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  GOTELEMETRY: 'off'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Backend tests and race detector
        run: go test -race ./cmd/drive && go vet ./cmd/drive
      - name: Known Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Browser protocol and archive tests
        run: node --test web/*.test.mjs
      - name: Validate production proxy
        run: docker run --rm -e DOMAIN=drive.miszori.dev -e ACME_EMAIL=test@example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start integration stack
        run: docker compose -p drive-test -f tests/compose.yaml up --build -d --wait
      - name: Scan the exact production Go binary
        run: |
          container_id=$(docker compose -p drive-test -f tests/compose.yaml ps -q api)
          docker cp "$container_id:/drive" "$RUNNER_TEMP/drive-security-scan"
          govulncheck -mode=binary "$RUNNER_TEMP/drive-security-scan"
      - name: Exercise Caddy and API
        run: node --test tests/*.test.mjs
      - name: Cleanup test stack
        if: always()
        run: |
          docker compose -p drive-test -f tests/compose.yaml down -v
          rm -f "$RUNNER_TEMP/drive-security-scan"
