name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  GOTELEMETRY: 'off'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Backend tests and race detector
        run: go test -race ./cmd/vault && go vet ./cmd/vault
      - name: Known Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Browser protocol and archive tests
        run: node --test web/*.test.mjs
      - name: WireGuard configuration and persistence tests
        run: node --test wireguard/*.test.mjs
      - name: Validate production proxies
        run: |
          for config in Caddyfile Caddyfile.vpn; do
            docker run --rm -e DOMAIN=vault.miszori.dev -e ACME_EMAIL=test@example.com -v "$PWD/$config:/etc/caddy/Caddyfile:ro" -v "$PWD/Caddyfile.common:/etc/caddy/common.caddy:ro" caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: Start integration stack
        run: docker compose -p vault-test -f tests/compose.yaml up --build -d --wait
      - name: Scan the exact production Go binary
        run: |
          container_id=$(docker compose -p vault-test -f tests/compose.yaml ps -q api)
          docker cp "$container_id:/vault" "$RUNNER_TEMP/vault-security-scan"
          govulncheck -mode=binary "$RUNNER_TEMP/vault-security-scan"
      - name: Exercise Caddy and API
        run: node --test tests/*.test.mjs
      - name: Cleanup test stack
        if: always()
        run: |
          docker compose -p vault-test -f tests/compose.yaml down -v
          rm -f "$RUNNER_TEMP/vault-security-scan"
