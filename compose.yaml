name: vault-miszori-dev

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_LISTEN_ADDR: 172.30.0.2:8080
      ADMIN_LISTEN_ADDR: 172.30.0.130:8081
      ADMIN_PROXY_IP: 172.30.0.131
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      PUBLIC_ORIGIN: https://${DOMAIN:-vault.miszori.dev}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-107374182400}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-64}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-4}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-2}
      MAX_BACKEND_CONNECTIONS: ${MAX_BACKEND_CONNECTIONS:-128}
      PUBLIC_REQUESTS_PER_MINUTE: ${PUBLIC_REQUESTS_PER_MINUTE:-600}
      AUTH_FAILURES_PER_MINUTE: ${AUTH_FAILURES_PER_MINUTE:-60}
    volumes:
      - packages:/data
    networks:
      backend:
        ipv4_address: 172.30.0.2
      vpn_backend:
        ipv4_address: 172.30.0.130
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    cpus: 2
    stop_grace_period: 40s
    ulimits:
      core: 0
      nofile: {soft: 2048, hard: 2048}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-vault.miszori.dev}
      PUBLIC_ORIGIN: https://${DOMAIN:-vault.miszori.dev}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "${PUBLIC_BIND_IP:?Set the host public-facing interface IP}:80:80"
      - "${PUBLIC_BIND_IP}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.common:/etc/caddy/common.caddy:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 128m
    ulimits:
      core: 0
      nofile: {soft: 2048, hard: 2048}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy-vpn:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      VPN_BIND_IP: ${VPN_BIND_IP:-10.0.0.1}
      PUBLIC_ORIGIN: https://${DOMAIN:-vault.miszori.dev}
      API_UPSTREAM: 172.30.0.130:8081
    ports:
      - "${VPN_BIND_IP:-10.0.0.1}:80:8081"
      - "${VPN_BIND_IP:-10.0.0.1}:443:8443"
    volumes:
      - ./Caddyfile.vpn:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.common:/etc/caddy/common.caddy:ro
      - ./web:/srv:ro
      - caddy_vpn_data:/data
      - caddy_vpn_config:/config
    networks:
      vpn_backend:
        ipv4_address: 172.30.0.131
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 128m
    ulimits:
      core: 0
      nofile: {soft: 2048, hard: 2048}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  packages:
  caddy_data:
  caddy_config:
  caddy_vpn_data:
  caddy_vpn_config:

networks:
  edge:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/25
  vpn_backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.128/25
